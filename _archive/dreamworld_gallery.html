const CAT_ORDER = ["髮型","鬍子","眉毛","髮飾","眼睛・手","武器","載具","護甲裝備","場景環境","綜合包"];
const BUNDLE_ORDER = ["200 Female and Male Haircard | Vol 3", "200 Realistic Female and Male Haircard | Vol 2", "200 Realistic Female and Male Haircard | Vol 1", "100 Realistic Beard and Mustache | Vol 1", "140 Female and Male Anime Haircard", "110 Female and Male Stylized Hairstyle", "640 Stylized Environment Base Mesh", "250 City", "150 Sci-Fi and Cyberpunk", "210 Cold War", "150 Realistic Gun and Explosive", "100 DreamWorld Gun"];
const state = { q: "", cat: "", form: "", style: "", gender: "", bundle: "", themes: new Set(), sort: "default" };

function currentList() {
  return ITEMS.filter(it =>
    (!state.q || it.title.toLowerCase().includes(state.q)) &&
    (!state.cat || it.cat === state.cat) &&
    (!state.form || it.form === state.form) &&
    (!state.style || it.style === state.style) &&
    (!state.gender || it.gender === state.gender) &&
    (!state.bundle || it.bundles.includes(state.bundle)) &&
    (state.themes.size === 0 || it.themes.some(t => state.themes.has(t))));
}

// dropdowns show live counts given the OTHER active filters
function otherFiltersMatch(it, key) {
  return (!state.q || it.title.toLowerCase().includes(state.q)) &&
    (key === "cat" || !state.cat || it.cat === state.cat) &&
    (key === "form" || !state.form || it.form === state.form) &&
    (key === "style" || !state.style || it.style === state.style) &&
    (key === "gender" || !state.gender || it.gender === state.gender) &&
    (key === "bundle" || !state.bundle || it.bundles.includes(state.bundle)) &&
    (key === "themes" || state.themes.size === 0 || it.themes.some(t => state.themes.has(t)));
}
function fillSelect(id, key, values) {
  const sel = document.getElementById(id);
  const keep = state[key];
  const match = key === "bundle" ? (it, v) => it.bundles.includes(v) : (it, v) => it[key] === v;
  const countFor = v => ITEMS.filter(it => otherFiltersMatch(it, key) && match(it, v)).length;
  sel.innerHTML = `<option value="">全部</option>` + values.map(v => {
    const n = countFor(v);
    return `<option value="${v}" ${v===keep?"selected":""} ${n===0?"disabled":""}>${v} (${n})</option>`;
  }).join("");
  sel.classList.toggle("active", !!keep);
}
function renderThemePanel() {
  const values = [...new Set(ITEMS.flatMap(i => i.themes))].sort((a,b) => a.localeCompare(b, "zh-Hant"));
  const countFor = v => ITEMS.filter(it => otherFiltersMatch(it, "themes") && it.themes.includes(v)).length;
  const panel = document.getElementById("theme-panel");
  panel.innerHTML = `<div class="msel-clear" id="theme-clear">清除主題</div>` + values.map(v => {
    const n = countFor(v);
    const on = state.themes.has(v);
    return `<label class="${n===0 && !on ? "disabled" : ""}">
      <input type="checkbox" data-theme="${v}" ${on?"checked":""} ${n===0 && !on ?"disabled":""}>${v} (${n})</label>`;
  }).join("");
  const btn = document.getElementById("theme-btn");
  btn.textContent = state.themes.size === 0 ? "全部 ▾" : [...state.themes].join("、") + " ▾";
  btn.classList.toggle("active", state.themes.size > 0);
  panel.querySelectorAll("input[data-theme]").forEach(cb => cb.onchange = () => {
    const v = cb.dataset.theme;
    if (cb.checked) state.themes.add(v); else state.themes.delete(v);
    render();
  });
  document.getElementById("theme-clear").onclick = () => { state.themes.clear(); render(); };
}

function refreshSelects() {
  const uniq = (arr, order) => {
    const s = [...new Set(arr)];
    return order ? order.filter(v => s.includes(v)).concat(s.filter(v => !order.includes(v))) : s.sort();
  };
  fillSelect("f-cat", "cat", uniq(ITEMS.map(i => i.cat), CAT_ORDER));
  fillSelect("f-form", "form", uniq(ITEMS.map(i => i.form), ["MEGA Bundle","一般包"]));
  fillSelect("f-bundle", "bundle", BUNDLE_ORDER);
  fillSelect("f-style", "style", uniq(ITEMS.map(i => i.style), ["寫實","寫實（未標示）","Anime","Stylized","Animation 卡通"]));
  fillSelect("f-gender", "gender", uniq(ITEMS.map(i => i.gender), ["女","男","男女皆有","未標示"]));
  renderThemePanel();
}

function render() {
  let list = currentList();
  if (state.sort === "price-asc") list = [...list].sort((a,b) => a.price - b.price);
  else if (state.sort === "price-desc") list = [...list].sort((a,b) => b.price - a.price);
  else if (state.sort === "title") list = [...list].sort((a,b) => a.title.localeCompare(b.title));
  document.getElementById("count").textContent = list.length + " / " + ITEMS.length;
  document.getElementById("grid").innerHTML = list.map(it => `
    <div class="card">
      <div class="imgwrap" onclick="lb(${it.i})"><img loading="lazy" src="${it.img}" width="${it.w}" height="${it.h}" alt=""></div>
      <div class="body">
        <div class="title">${esc(it.title)}</div>
        <div class="tagrow">
          <span class="tag cat">${it.cat}</span><span class="tag">${it.form}</span>
          <span class="tag">${it.style}</span><span class="tag">${it.gender}</span>
          ${it.themes.filter(t => t !== "一般").map(t => `<span class="tag">${t}</span>`).join("")}
        </div>
        ${it.contents.length ? `<div><span class="bundlebtn" onclick="openBundle(${it.i})">📦 查看內容物 ${it.contents.length} 包</span></div>` : ""}
        ${it.in_bundles.length ? `<div class="inbundle" onclick="openBundle(${it.in_bundles[0]})">📦 收錄於 MEGA Bundle${it.in_bundles.length>1?" ×"+it.in_bundles.length:""}</div>` : ""}
        <div class="row">
          <span class="price ${it.price>0?"paid":""}">${it.price_str}</span>
          <a class="link" href="${it.url}" target="_blank" rel="noopener">商品頁 ↗</a>
        </div>
      </div>
    </div>`).join("");
  refreshSelects();
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function openBundle(i){
  const b = ITEMS[i];
  const members = b.contents.map(j => ITEMS[j]);
  const sum = members.reduce((s,m) => s + m.price, 0);
  const save = sum - b.price;
  document.getElementById("bm-box").innerHTML = `
    <span class="bm-close" onclick="closeBundle()">✕</span>
    <h2>📦 ${esc(b.title)}</h2>
    <div class="bm-sub">Bundle 價 <b style="color:#f0b452">${b.price_str}</b> ·
      內含 ${members.length} 包，單買合計 $${sum.toFixed(2)}
      ${save > 0 ? `· <b class="save">買 Bundle 省 $${save.toFixed(2)}</b>` : ""}
      · <a class="link" href="${b.url}" target="_blank" rel="noopener" style="color:#7ab3ff">商品頁 ↗</a></div>
    ${members.map(m => `
      <div class="bm-row">
        <img loading="lazy" src="${m.img}" onclick="lb(${m.i})">
        <div class="t">${esc(m.title)}<br>
          <a class="link" href="${m.url}" target="_blank" rel="noopener" style="color:#7ab3ff;font-size:12px">商品頁 ↗</a>
          ${m.in_bundles.length>1 ? `<span class="inbundle" style="margin-left:8px">也在其他 Bundle</span>` : ""}
        </div>
        <div class="p">${m.price_str}</div>
      </div>`).join("")}`;
  document.getElementById("bmodal").classList.add("show");
}
function closeBundle(){ document.getElementById("bmodal").classList.remove("show"); }
document.getElementById("bmodal").onclick = e => { if (e.target.id === "bmodal") closeBundle(); };
function lb(i){
  const it = ITEMS[i];
  document.getElementById("lbimg").src = it.img;
  document.getElementById("lbcap").textContent = it.title + "  —  " + it.price_str;
  document.getElementById("lightbox").classList.add("show");
}
document.getElementById("lightbox").onclick = () => {
  document.getElementById("lightbox").classList.remove("show");
  document.getElementById("lbimg").src = "";
};
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("lightbox").classList.contains("show")) document.getElementById("lightbox").click();
  else closeBundle();
});
document.getElementById("q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };
for (const [id, key] of [["f-cat","cat"],["f-form","form"],["f-style","style"],["f-gender","gender"],["f-bundle","bundle"]]) {
  document.getElementById(id).onchange = e => { state[key] = e.target.value; render(); };
}
document.getElementById("theme-btn").onclick = e => {
  e.stopPropagation();
  document.getElementById("f-theme").classList.toggle("open");
};
document.getElementById("theme-panel").onclick = e => e.stopPropagation();
document.addEventListener("click", () => document.getElementById("f-theme").classList.remove("open"));
document.getElementById("reset").onclick = () => {
  state.q = state.cat = state.form = state.style = state.gender = state.bundle = "";
  state.themes.clear();
  state.sort = "default";
  document.getElementById("q").value = "";
  document.getElementById("sort").value = "default";
  render();
};
render();
</script>
</body>
</html>
