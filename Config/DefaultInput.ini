bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
; --- 2026-08-25 延遲戰役（user 指令：操作→筆真的動 這一段也要最低延遲）---
; 引擎預設的滑鼠平滑（UPlayerInput::SmoothMouse）做兩件事，兩件都是本作的毒：
;   ① 把 delta 依「樣本/tick 恆定」跨幀重分配＝位移被攤到後面的幀（純滯後）
;   ② **手停下後繼續合成位移**（aMouse==0 分支會吐 SmoothedMouse×dt/取樣間隔）
; ②直接推翻本作寫在程式裡的承重不變量「滑鼠 delta=0 ⇒ aim 靜止 ⇒ P 走快取
; ＝靜止不抖由構造保證」（NiceInkCharacter.cpp EffectiveDrawAz 註解）——那條
; 保證在平滑開著時是假的。畫圖遊戲的整個設計是「滑鼠純積分、系統只讀不控」
; （07-31 六版 user 逐字定案），引擎在上游偷改 delta 與該定案直接牴觸。
; 平均增益不變（平滑是速率正規化不是縮放）⇒ 這是純延遲修，不動手感刻度。
bEnableMouseSmoothing=False
; bEnableFOVScaling 維持 True＝**現況手感的一部分，不在本批動**。
; 記帳（08-25 讀碼發現，未修）：引擎這條會把滑鼠乘上 FOVScale(0.01111)×FOV，
; 站姿 FOV90 ⇒ ×1.0、鎖定 FOV36 ⇒ ×0.40；而 DrawAimSensitivity() 又自己乘了
; 一次開鏡定律 tan18/tan45≈0.325 ⇒ **鎖定作畫實際是 0.130，不是設計的 0.325**
; ＝雙重補償。關掉它游標會快 2.5 倍——那是 user 的口味域（08-01 血價：
; 「太敏感」的主詞不是速度、0.4 版誤修已還原），沒點名不准動。要改＝先量再裁。
bEnableFOVScaling=True
bCaptureMouseOnLaunch=True
bEnableLegacyInputScales=True
bEnableMotionControls=True
bFilterInputByPlatformUser=False
bShouldFlushPressedKeysOnViewportFocusLost=True
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True
bEnableGestureRecognizer=False
bUseAutocorrect=False
bEnabledLegacyMappingDeprecationWarnings=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
FOVScale=0.011110
DoubleClickTime=0.200000
DeprecatedActionAndAxisNames=()
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
