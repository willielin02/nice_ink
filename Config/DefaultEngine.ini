; （分解實驗：只換 TAA=12.7ms、只關 Lumen/VSM 保留 TSR=49ms＝TSR 是唯一兇手）。
; 本作=fullbright＋材質假光美術：Lumen GI/反射/虛擬陰影全無消費者，一併關閉
; （本機量測近乎免費，但打包版/他牌硬體不賭）；像素差分驗證關閉後畫面幾何無變
; （mean diff 1.56/255，殘差=格柵邊緣 AA 風格差）。TAA 視覺驗收＝user viewport；
; veil 時域閃爍需重跑 robo_veilflicker（該儀器當年在 TSR 下校的）。
