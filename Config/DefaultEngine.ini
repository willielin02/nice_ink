; 2026-08-25 撕裂修的配套（user 回報「遊戲房間內橫向像素錯位、像水平橫條」）：
; 病根＝120fps 上限對 60Hz 螢幕是整數 2 倍且 VSync 關 ⇒ 撕裂線幾乎定在同一高度
; 不動＝最顯眼的那種撕裂。VSync 已改預設開（NiceInkGameInstance 的 v2 遷移）。
; VSync 的已知代價是把 present 佇列填深＝輸入延遲上升；r.GTSyncType=2 是引擎
; 為這個情境內建的低延遲模式（遊戲執行緒改與 swap chain flip 同步）。
;
; **誠實記帳**：本項的「幀率無代價」已驗（開啟後 Frame 仍 16.69ms＝60fps 穩住）；
; 但**延遲的收益本身沒有被驗證過**——`stat unit` 的 Input 是每 2 秒才取樣一次、
; 再套 0.9/0.1 的 EMA（時間常數 ~20 秒），在合理的測試窗內分辨不出組態差異
;（同一組態跨次量到 65~99ms 全是同一個未收斂平均的雜訊）。要真的驗它需要一支
; 專門的延遲儀器。留著＝引擎文件指定的正解且無可量代價；要拆隨時可拆。
; 同族（量過但不出貨）：r.OneFrameThreadLag=0 會關掉 CPU/GPU 重疊 ⇒ GPU-bound
; 的機器（08-11 記錄的 iGPU 1080p 50fps 那台）會掉幀率，別人的機器不賭。
[SystemSettings]
r.GTSyncType=2
