; 角色移動屬性複製整段被跳過＝場內卡頓/橡皮筋真兇。提到 1MB/s；臉列車同批
; 降速到每連線 ~320KB/s（NiceInkCharacter/GameMode 的 chunk budget）＝帽下恆有餘裕。
; 這組值走 UNetConnection 速率控制，EOS P2P driver（繼承 IpNetDriver 段）同樣吃到。
